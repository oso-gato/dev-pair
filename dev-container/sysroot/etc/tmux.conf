# tmux server policy — the geometry rules that let one session be worked from
# more than one device at a time.
#
# The objective requires a session reachable from any authorized device, and
# more than one authorized device reaches it at once. A tmux window has exactly
# one size shared by every client viewing it, so two clients of different sizes
# looking at the same window cannot both be full-size. What this file chooses
# is which size wins and how the client that loses degrades, because the
# alternative is not "both fit" but "whichever attached last repaints everyone
# else onto a foreign grid".
#
# The other half of the answer is in the login profile, which joins each login
# to the shared session as its own client-scoped session in a session group.
# Windows are then shared and geometry is per client, so this file only has to
# settle the case where two clients are on the SAME window.
#
# This file is deliberately identical on the host and in the dev-container. The
# rule is the platform's rather than a component's, so a difference between the
# two copies is drift and not a decision.

# The size follows the client that most recently sent input. Picking up a
# second device and typing rescales the window to that device instead of
# holding it at the first device's grid, and both stay attached throughout,
# which is what a mosh client roaming between networks needs.
set -g window-size latest

# A client parked on a different window is sized to itself, so two devices
# contend over geometry only while they are looking at the same thing.
setw -g aggressive-resize on

# The surplus area of a client larger than the current size is left blank
# rather than filled with tmux's compiled-in middle dot, which reads as a
# garbled screen rather than as unused space.
setw -g fill-character ' '

# Repaint on attach and on resize, server-driven. A client that does not redraw
# itself — a browser terminal, or mosh immediately after a roam — otherwise
# keeps the frame it had before the rescale, and a stale frame is
# indistinguishable from a hung session.
set-hook -g client-attached 'refresh-client'
set-hook -g client-resized  'refresh-client'
