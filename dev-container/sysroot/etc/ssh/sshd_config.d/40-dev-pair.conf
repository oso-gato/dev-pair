# dev-container shell-access policy: keys only, root never.
#
# This component carries its own public door. The objective's Security outcome 1
# names "hardened SSH/MOSH on both components of every pair" as the only public
# doors — both, not the host alone — so reaching this container by way of the
# host would leave one of the two doors the objective requires unbuilt.
#
# The port is not 22 because the host's sshd already holds that on the same
# public address. Everything else is identical to the host's policy, because it
# is the same law: no password authenticates a remote shell anywhere in the
# platform, public or private.
Port 2222
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Host keys live on a mounted volume, not in the image. An image-baked host key
# would be identical on every pair that ran this image — the shared-credential
# case C6 forbids — and a key regenerated per container start would trip every
# client's host-key check on each relaunch.
HostKey /etc/ssh/keys/ssh_host_ed25519_key
HostKey /etc/ssh/keys/ssh_host_rsa_key
