# dev-pair shell-access policy: keys only on every path, root never.
#
# Fedora's stock sshd_config permits password authentication, so these
# overrides are load-bearing rather than decorative. They are the objective's
# Security outcome 2 made real: no password ever authenticates a remote shell
# anywhere in the platform, and root never authenticates remotely after genesis
# (C7). mosh authenticates through this same sshd, so it inherits all of it.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
