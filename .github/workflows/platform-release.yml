name: Fedora platform release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-release-main
  cancel-in-progress: false

jobs:
  admit:
    if: >-
      github.repository == 'oso-gato/dev-pair' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.event_name == 'push' &&
      github.run_attempt == 1
    environment: platform-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      host-config: ${{ steps.site.outputs.host-config }}
      plan: ${{ steps.site.outputs.plan }}
      previous: ${{ steps.site.outputs.previous }}
      artifact-bytes: ${{ steps.site.outputs.artifact-bytes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Admit exact protected source and allocated transport
        id: site
        env:
          HOST_CONFIG: ${{ vars.PLATFORM_HOST_CONFIG_SHA256 }}
          LAUNCH_PLAN: ${{ vars.PLATFORM_LAUNCH_PLAN_SHA256 }}
          PREVIOUS: ${{ vars.PLATFORM_PREVIOUS_SHA256 }}
          ARTIFACT_BYTES: ${{ vars.PLATFORM_ARTIFACT_BYTES }}
        run: python3 -B tools/platform_release.py admit --source "$GITHUB_SHA"

  image:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        role: [maintenance, development, devbox]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Build and verify one exact OCI artifact
        env:
          ROLE: ${{ matrix.role }}
        run: python3 -B tools/platform_release_ci.py "$ROLE" --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-${{ matrix.role }}-${{ github.sha }}
          path: ${{ runner.temp }}/platform-${{ matrix.role }}-${{ github.sha }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  host:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Package the Git-verified host control-plane files
        run: python3 -B tools/platform_release.py host --source "$GITHUB_SHA" --output "$RUNNER_TEMP/platform-host-$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-host-${{ github.sha }}
          path: ${{ runner.temp }}/platform-host-${{ github.sha }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [admit, image, host]
    if: >-
      github.repository == 'oso-gato/dev-pair' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.event_name == 'push' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: platform-*-${{ github.sha }}
          path: ${{ runner.temp }}/platform-parts
      - name: Verify all parts and assemble both release subjects
        env:
          HOST_CONFIG: ${{ needs.admit.outputs.host-config }}
          LAUNCH_PLAN: ${{ needs.admit.outputs.plan }}
          PREVIOUS: ${{ needs.admit.outputs.previous }}
          ARTIFACT_BYTES: ${{ needs.admit.outputs.artifact-bytes }}
        run: |
          python3 -B tools/platform_release.py assemble --source "$GITHUB_SHA"             --input "$RUNNER_TEMP/platform-parts" --output "$RUNNER_TEMP/platform-subjects-$GITHUB_SHA"             --run-id "$GITHUB_RUN_ID" --host-config-sha256 "$HOST_CONFIG" --plan-sha256 "$LAUNCH_PLAN"             --previous "$PREVIOUS" --approved-artifact-bytes "$ARTIFACT_BYTES"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/platform-subjects-${{ github.sha }}/platform.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/platform-subjects-${{ github.sha }}/release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-subjects-${{ github.sha }}
          path: ${{ runner.temp }}/platform-subjects-${{ github.sha }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Record immutable release coordinates
        run: |
          printf 'Source `%s` · Actions run `%s`\n\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          (cd "$RUNNER_TEMP/platform-subjects-$GITHUB_SHA" && sha256sum platform.json release.json) >> "$GITHUB_STEP_SUMMARY"
