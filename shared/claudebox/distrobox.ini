# claudebox — the disposable agent layer (C8), declaratively defined.
#
# Shared by both components of a pair: C8 pairs boxes by agent across a pair's
# components, so an agent present on the dev-container is present on its host.
# This one manifest is what both assemble from, which is why it lives in
# shared/ rather than in either component.
#
# Rebuild, never update (C8). `claudebox-rebuild` destroys and recreates from
# THIS file; the component underneath is never mutated. Everything durable —
# credentials, transcripts, configuration — lives outside the layer, so a
# rebuild loses nothing.
#
# Fedora version is pinned to the component's own generation. Bump it
# deliberately with the base image, never to :latest — :latest would rebase to
# the next Fedora silently at release.
[claudebox]
image=quay.io/fedora/fedora-toolbox:44
pull=true
replace=false
# Do NOT add init=true: distrobox gates the host /run/user/<uid> bind-mount on
# init=0, and an initful box silently loses the host podman socket the bridge
# in claudebox-init.sh depends on.
#
# Anthropic's own dnf repository must exist BEFORE the package install, so it
# is written in a pre_init hook. Channel `latest` is deliberate and is what the
# DAILY rebuild is for: the box carries the current Claude Code because it is
# rebuilt, never because it updated itself. The agent's self-update is disabled
# by construction in managed-settings.json — a self-installed binary would
# shadow the managed one, survive the rebuild, and strand the layer stale while
# appearing current (C8).
#
# Signing key fingerprint, from the estate's donor trail:
#   31DD DE24 DDFA B679 F42D 7BD2 BAA9 29FF 1A7E CACE
#
# HOOK QUOTING IS LOAD-BEARING. `distrobox assemble` double-evaluates hooks, so
# what follows is single-quoted only, with no double quotes and no shell
# keywords. Anything needing redirection or its own quoting is applied after
# assemble over the quote-safe `distrobox enter -- sudo` channel; that is what
# claudebox-init.sh is for, and moving work back into a hook re-breaks it.
pre_init_hooks=sh -c 'set -f; echo [claude-code] > /etc/yum.repos.d/claude-code.repo; echo name=Claude Code >> /etc/yum.repos.d/claude-code.repo; echo baseurl=https://downloads.claude.ai/claude-code/rpm/latest >> /etc/yum.repos.d/claude-code.repo; echo enabled=1 >> /etc/yum.repos.d/claude-code.repo; echo gpgcheck=1 >> /etc/yum.repos.d/claude-code.repo; echo gpgkey=https://downloads.claude.ai/keys/claude-code.asc >> /etc/yum.repos.d/claude-code.repo'
# bubblewrap backs claude-code's sandboxed-bash; socat and host-spawn are the
# box-to-host bridge the maintenance role needs; the rest is the working set a
# session uses against the ticket bus.
additional_packages=claude-code host-spawn bubblewrap socat podman git gh tmux
